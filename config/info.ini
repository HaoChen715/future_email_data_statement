# 运行参数: Place 选择生产/测试环境(Trade=生产 / Test=测试, 统一切换数据库与文件目录)
# 处理日期与执行步骤通过命令行参数控制: python main.py yyyymmdd [today|last] [steps...]
[RunParams]
Place=Trade

# 数据库密码为 Fernet 密文, 使用 generate_password.py 生成
[DataBaseParams]
host=
port=
user=
password=
database=

[TestDataBaseParams]
host=
port=
user=
password=
database=

# 生产环境文件目录(键名与 auto_down_email 项目 data_paths.json 一致)
[FilePath]
email_download_root=/mnt/data/work_file/attachments
resource_root=./resource
unzip_zip_root=/mnt/data/work_file/unzip/zip
unzip_extract_root=/mnt/data/work_file/unzip/extract
unzip_final_root=/mnt/data/work_file/unzip/final_file
unzip_question_root=/mnt/data/work_file/unzip/question

# 测试环境文件目录
[TestFilePath]
email_download_root=./test_data/attachments
resource_root=./test_resource
unzip_zip_root=./test_data/unzip/zip
unzip_extract_root=./test_data/unzip/extract
unzip_final_root=./test_data/unzip/final_file
unzip_question_root=./test_data/unzip/question
