# 部署模板: 复制为 config/info.ini 后按实际环境填写
# 运行参数: Place 选择生产/测试环境(Trade=生产 / Test=测试, 统一切换数据库与文件目录)
# 处理日期与执行步骤通过命令行参数控制: python main.py yyyymmdd [today|last] [steps...]
[RunParams]
Place=Trade

# 数据库密码为 Fernet 密文, 使用 generate_password.py 生成
[DataBaseParams]
host=
port=
user=
password=
database=
data_path=

[TestDataBaseParams]
host=
port=
user=
password=
database=
data_path=

# 生产环境文件目录
[FilePath]
attachments_dir=/mnt/data/work_file/attachments
resource_dir=./resource
history_dir=/mnt/data/email/history
zip_file_dir=/mnt/data/work_file/unzip/zip
extract_directory=/mnt/data/work_file/unzip/extract
final_directory=/mnt/data/work_file/unzip/final_file
question_directory=/mnt/data/work_file/unzip/question

# 测试环境文件目录
[TestFilePath]
attachments_dir=./test_data/attachments
resource_dir=./test_resource
history_dir=./test_data/history
zip_file_dir=./test_data/unzip/zip
extract_directory=./test_data/unzip/extract
final_directory=./test_data/unzip/final_file
question_directory=./test_data/unzip/question
