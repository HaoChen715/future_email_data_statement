# 部署模板: 复制为 config/info.ini 后按实际环境填写
# 运行参数: Place 选择生产/测试环境(Trade=生产 / Test=测试, 统一切换入库 API 与文件目录)
# 处理日期与执行步骤通过命令行参数控制: python main.py yyyymmdd [today|last] [steps...]
# Force_redownload=True 时入库忽略已成功日志, 全部重新解析入库(删除重新入库)
[RunParams]
Place=Trade
Force_redownload=False
# 只扫描/匹配的对账单文件扩展名(逗号分隔, 不区分大小写), 其余格式直接跳过以节省时间
File_extensions=.txt,.xlsx,.xls

# 券商白名单: 仅列表内券商视为「已注册券商」(生成目录/匹配文件/入库), 逗号分隔
# 留空表示不限制(全部券商); 例: brokers=国君,国泰海通
[BrokerFilter]
brokers=

# 入库 API 配置(网关签名鉴权): base_url 含上下文路径, 如 http://192.168.166.4/agent-monitor-boot
# signature = md5(app_key + app_secret + timestamp(毫秒)), 由程序每次请求即时生成
# verify_ssl=False 时跳过 HTTPS 证书校验(内网自签证书场景)
[ApiParams]
base_url=
timeout=30
app_key=
app_secret=
user_agent=
verify_ssl=True
# 开发新增的写处理日志接口路径(用于写 log_type=对账单文件), 留空则不写
# 开发已按文档实现, 若实际路径不同请在此调整
log_path=/openApi/billFutureApi/insertProcessingLog

[TestApiParams]
base_url=
timeout=30
app_key=
app_secret=
user_agent=
verify_ssl=True
log_path=/openApi/billFutureApi/insertProcessingLog

# 生产环境文件目录(键名与 auto_down_email 项目 data_paths.json 一致)
[FilePath]
email_download_root=/mnt/data/work_file/attachments
resource_root=./resource
unzip_zip_root=/mnt/data/work_file/unzip/zip
unzip_extract_root=/mnt/data/work_file/unzip/extract
unzip_final_root=/mnt/data/work_file/unzip/final_file
unzip_question_root=/mnt/data/work_file/unzip/question

# 测试环境文件目录
[TestFilePath]
email_download_root=./test_data/attachments
resource_root=./test_resource
unzip_zip_root=./test_data/unzip/zip
unzip_extract_root=./test_data/unzip/extract
unzip_final_root=./test_data/unzip/final_file
unzip_question_root=./test_data/unzip/question
