[project]
name = "future_email_data_statement"
version = "0.1.0"
description = "期货对账单数据 邮件下载→解压→账号匹配迁移 程序"
authors = [
    {name = "hao-chen-vm", email = "hc07150525@gmail.com"},
]
dependencies = [
    "sqlalchemy>=2.0.52",
    "pandas>=3.0.5",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "imapclient>=3.1.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.3.post1",
    "tqdm>=4.70.0",
    "patool>=4.0.5",
    "rarfile>=4.2",
    "pandas-market-calendars>=5.4.0",
    "cryptography>=50.0.0",
    "pymysql>=1.1.1",
    "certifi>=2026.7.22",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "cython>=3.2.5",
    "pyinstaller>=6.20.0",
]

[[tool.pdm.source]]
name = "mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
verify_ssl = true
